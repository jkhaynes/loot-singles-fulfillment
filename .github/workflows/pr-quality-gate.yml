name: PR Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Reject tracked secrets
        shell: bash
        run: |
          credential_pattern='(Pass''word|Pwd|User ID|AccountKey|SharedAccessSignature)[[:space:]]*='
          if git grep -n -I -E "$credential_pattern" -- '*.json' '*.md' '*.yml' '*.yaml' '*.cs'; then
            echo "Tracked configuration or documentation contains a credential-bearing assignment."
            exit 1
          fi
      - name: Build backend
        run: dotnet build backend/LootSingles.sln
      - name: Run database-free unit tests
        run: dotnet test backend/tests/LootSingles.UnitTests/LootSingles.UnitTests.csproj --no-build
      - name: Run SQL Server integration tests
        run: dotnet test backend/tests/LootSingles.IntegrationTests/LootSingles.IntegrationTests.csproj --no-build

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Run frontend unit tests
        run: npm --prefix frontend run test
      - name: Build frontend
        run: npm --prefix frontend run build

  csharpier:
    name: Check C# formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore local tools
        run: dotnet tool restore
      - name: Check backend formatting
        run: dotnet csharpier check backend

  prettier:
    name: Check frontend formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend formatting
        run: npm --prefix frontend run format:check

  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, frontend, csharpier, prettier]
    if: always()

    steps:
      - name: Verify all required jobs succeeded
        if: >
          needs.backend.result != 'success' ||
          needs.frontend.result != 'success' ||
          needs.csharpier.result != 'success' ||
          needs.prettier.result != 'success'
        run: |
          echo "One or more required jobs did not succeed."
          exit 1

      - name: All required jobs passed
        if: >
          needs.backend.result == 'success' &&
          needs.frontend.result == 'success' &&
          needs.csharpier.result == 'success' &&
          needs.prettier.result == 'success'
        run: echo "All required jobs passed."
